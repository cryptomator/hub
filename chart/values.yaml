urls:
  hub:
    public: ""
  kc:
    public: ""
    clusterInternal: ""
    authServerUrl: ""
    tokenIssuer: ""
  billing:
    public: ""

notes:
  useColor: true

secrets:
  # When true, all chart-managed Secrets are annotated `helm.sh/resource-policy: keep` so they survive `helm uninstall`.
  # Convenient for development (passwords stay stable across reinstalls) but a security risk in production
  keepOnUninstall: false

ingress:
  # supported: nginx, traefik
  controller: ""
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

hub:
  replicas: 1
  imagePullPolicy: IfNotPresent
  image:
    tag: "" # defaults to chart appVersion
  service:
    type: ClusterIP
    port: 8080
    managementPort: 9000
  resources:
    requests:
      cpu: 50m
      memory: 16Mi
    limits:
      memory: 256Mi
  config:
    keycloakRealm: cryptomator
    keycloakSyncerPeriod: 5m
    contentSecurityPolicy: ""
  metrics:
    # Hub ships metrics, traces and logs via OpenTelemetry / OTLP.
    enabled: false
    endpoint: "https://otel-collector:443"
    protocol: "http/protobuf"
    # Extra resource attributes merged into the defaults (service.name, service.version).
    # Example: { deployment.environment: production, team: platform }
    resourceAttributes: {}
    otlp: # Optional Basic Authentication for OTLP endpoint
      username: ""
      password: ""
  oidc:
    clientId: cryptomatorhub
  database:
    jdbcUrl: ""
    name: hub
    username: hub
    password: ""
  admin:
    username: admin
    password: ""
    passwordTemporary: true
  secrets:
    create: true
    systemClientSecret: "" # optional; auto-generated when chart manages Hub secret
    initialId: ""
    initialLicense: ""
  license:
    chain:
      requiredCn: ""
    managedApi:
      username: ""
      password: ""
    apiUrl: ""

keycloak:
  enabled: true
  replicas: 1
  imagePullPolicy: IfNotPresent
  image:
    tag: ""
  service:
    type: ClusterIP
    httpPort: 8080
    managementPort: 9000
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      memory: 640Mi
  admin:
    username: admin
    password: ""
  config:
    proxyHeaders: xforwarded
  database:
    jdbcUrl: ""
    name: keycloak
    username: keycloak
    password: ""
  realmBootstrap:
    realmId: ""

postgres:
  enabled: true
  imagePullPolicy: IfNotPresent
  image:
    tag: ""
  service:
    type: ClusterIP
    port: 5432
  storage:
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 200m
      memory: 32Mi
    limits:
      memory: 256Mi
  auth:
    adminUsername: postgres
    adminPassword: ""
