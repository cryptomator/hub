name: Build Keycloak Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag'
        required: true

env:
  NODE_VERSION: 22

defaults:
  run:
    shell: bash

jobs:
  build-image:
    name: Build Custom Keycloak Image
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
      id-token: write # Required for the attestations step
      attestations: write # Required for the attestations step
      artifact-metadata: write # Required for the attestations step
      packages: write # Required for pushing the image to GHCR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: keycloak/themes/cryptomator/common/resources/package.json
      - name: Check lockfile integrity
        working-directory: keycloak/themes/cryptomator/common/resources
        run: bash scripts/check-lockfile.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: keycloak/themes/cryptomator/common/resources/pnpm-lock.yaml
      - name: Install Dependencies
        working-directory: keycloak/themes/cryptomator/common/resources
        run: pnpm install --frozen-lockfile
      - name: Build Theme
        working-directory: keycloak/themes/cryptomator/common/resources
        run: pnpm run build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Container Image
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: keycloak
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cryptomator/keycloak:${{ github.event.inputs.tag }}
      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ghcr.io/cryptomator/keycloak
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true