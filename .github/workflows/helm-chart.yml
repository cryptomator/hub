name: Helm Chart

on:
  push:
    branches: ["**"]
    paths:
      - chart/**
      - .github/workflows/helm-chart.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart Version'
        required: true
      appVersion:
        description: 'App Version'
        required: true
  workflow_call:
    inputs:
      version:
        description: 'Chart Version'
        required: true
        type: string
      appVersion:
        description: 'App Version'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint chart

  publish:
    name: Publish Helm Chart
    needs: lint
    if: inputs.version && inputs.appVersion || contains(github.event.head_commit.message, '[build chart]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
      id-token: write # Required for the attestations step
      attestations: write # Required for the attestations step
      artifact-metadata: write # Required for the attestations step
      packages: write # Required for pushing the chart to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute publish version
        id: version
        env:
          # Pass inputs via env so the shell treats them as data, not as code to interpolate (avoids template injection).
          INPUT_APP_VERSION: ${{ inputs.appVersion }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_APP_VERSION" ]]; then
            # Inputs come from workflow_dispatch/workflow_call; treat as untrusted and allow only OCI-tag-safe characters.
            if [[ ! "$INPUT_APP_VERSION" =~ ^[0-9A-Za-z._-]+$ || ! "$INPUT_VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Invalid appVersion/version input (allowed: [0-9A-Za-z._-])" >&2
              exit 1
            fi
            publish_app_version="$INPUT_APP_VERSION"
            publish_version="$INPUT_VERSION"
          else
            # Triggered by `[build chart]` push (branch-only via `branches: ["**"]`); derive from commit SHA.
            # SemVer pre-release sorts below any real release; `-` (not `+`) keeps the tag OCI-compatible.
            publish_app_version="${GITHUB_SHA::7}"
            publish_version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "publish_version=${publish_version}" >> "$GITHUB_OUTPUT"
          echo "publish_app_version=${publish_app_version}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package chart \
            --destination dist \
            --version "${{ steps.version.outputs.publish_version }}" \
            --app-version "${{ steps.version.outputs.publish_app_version }}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Helm Registry: Login to GHCR"
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        id: push
        run: |
          set -euo pipefail
          push_output=$(helm push "dist/cryptomator-hub-${{ steps.version.outputs.publish_version }}.tgz" "oci://ghcr.io/cryptomator/charts" 2>&1)
          echo "$push_output"

          digest=$(printf '%s\n' "$push_output" | grep -Eo 'sha256:[0-9a-fA-F]{64}' | tail -n1 || true)
          if [[ -z "$digest" ]]; then
            echo "Failed to extract chart digest from helm push output" >&2
            echo "Raw helm push output:" >&2
            echo "$push_output" >&2
            exit 1
          fi

          echo "chart_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/cryptomator/charts/cryptomator-hub@${{ steps.push.outputs.chart_digest }}"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: "ghcr.io/cryptomator/charts/cryptomator-hub"
          subject-digest: ${{ steps.push.outputs.chart_digest }}
          push-to-registry: true
