name: Tag Existing Image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Digest of Image
        required: true
      tag:
        description: 'Image Tag'
        required: true

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tags an existing image
    runs-on: ubuntu-latest
    permissions:
      packages: write # Required for pushing the image to GHCR
    steps:
      - name: Pull image defined by digest
        run: docker pull "ghcr.io/cryptomator/hub@${DIGEST}"
        env:
          DIGEST: ${{ github.event.inputs.digest }}
      - name: Tag image in github registry
        run: docker tag "ghcr.io/cryptomator/hub@${DIGEST}" "ghcr.io/cryptomator/hub:${TAG}"
        env:
          DIGEST: ${{ github.event.inputs.digest }}
          TAG: ${{ github.event.inputs.tag }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tagged image
        run: docker push "ghcr.io/cryptomator/hub:${TAG}"
        env:
          TAG: ${{ github.event.inputs.tag }}