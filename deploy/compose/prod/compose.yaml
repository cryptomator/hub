# Cryptomator Hub on a single Docker host: Hub, Keycloak and PostgreSQL behind Traefik with Let's Encrypt certificates.
#
# Before the first start, replace every occurrence of:
#   hub.example.com, kc.example.com, admin@example.com   — your public hostnames (DNS must point at this host, ports 80/443 reachable) and ACME contact
#   CHANGE-ME-*                                          — passwords and secrets; generate with `openssl rand -hex 32`. Each value appears in more than one place, keep them consistent.
#
# Hub:      https://hub.example.com  (realm user `admin`, must change the password on first login)
# Keycloak: https://kc.example.com   (bootstrap admin `admin`; create a permanent admin in the `master` realm and delete the bootstrap account afterwards)
#
# Keycloak imports the realm below on its FIRST start only. Hostnames and secrets changed later must also be changed in the Keycloak admin console.
services:

  # Reverse proxy and TLS termination. Discovers the routes from the `traefik.*` labels below via the Docker socket (Podman: mount /run/podman/podman.sock instead).
  #
  # Existing certificate or TLS terminated elsewhere: replace this service with your own proxy. Whatever terminates TLS must forward `X-Forwarded-Proto` / `X-Forwarded-Host`
  # to `hub:8080` and `keycloak:8080` — `KC_PROXY_HEADERS` and `QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING` below make Keycloak and Hub trust these headers.
  traefik:
    image: traefik:v3.7.12
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --certificatesResolvers.letsencrypt.acme.email=admin@example.com
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  # One PostgreSQL instance with two databases (`hub`, `keycloak`). Not exposed to the host.
  # Existing PostgreSQL: remove this service and point `KC_DB_*` and `QUARKUS_DATASOURCE_*` below at your server (two databases, two users).
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: CHANGE-ME-HUB-DB-PASSWORD
    configs:
      - source: create-keycloak-db
        target: /docker-entrypoint-initdb.d/create-keycloak-db.sql
    volumes:
      # postgres >= 18 keeps PGDATA in /var/lib/postgresql/<major>/docker, so the volume is mounted one level up
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Stock Keycloak plus the Cryptomator login theme. Imports the `cryptomator-realm` config on first boot.
  #
  # Existing Keycloak: remove this service and the `cryptomator-realm` config, point `HUB_KEYCLOAK_PUBLIC_URL`, `HUB_KEYCLOAK_LOCAL_URL`, `QUARKUS_OIDC_AUTH_SERVER_URL` and
  # `QUARKUS_OIDC_TOKEN_ISSUER` of the `hub` service at your instance and import the realm from the `cryptomator-realm` config there (https://www.keycloak.org/server/importExport).
  # The secret of the `cryptomatorhub-system` client must equal `HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET`, and Keycloak's origin must be in the `connect-src` of Hub's Content Security Policy.
  keycloak:
    image: ghcr.io/cryptomator/keycloak:26.7.3
    command: start --optimized --import-realm
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: CHANGE-ME-KEYCLOAK-DB-PASSWORD
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE-ME-KEYCLOAK-ADMIN-PASSWORD
      # TLS is terminated by Traefik; Keycloak serves plain HTTP on the internal network and trusts the X-Forwarded-* headers:
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # issuer/discovery URLs advertise the public origin; Hub's backchannel requests via http://keycloak:8080 still work:
      KC_HOSTNAME: https://kc.example.com
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY: "false"
    configs:
      - source: cryptomator-realm
        target: /opt/keycloak/data/import/cryptomator-realm.json
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.rule: "Host(`kc.example.com`)"
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls.certresolver: letsencrypt
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The Hub application, configured through environment variables (same settings as the Helm chart). Only reachable through Traefik.
  hub:
    image: ghcr.io/cryptomator/hub:2.0.1
    environment:
      HUB_PUBLIC_ROOT_PATH: /
      HUB_KEYCLOAK_PUBLIC_URL: https://kc.example.com
      HUB_KEYCLOAK_LOCAL_URL: http://keycloak:8080
      HUB_KEYCLOAK_REALM: cryptomator
      HUB_KEYCLOAK_SYSTEM_CLIENT_ID: cryptomatorhub-system
      HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET: CHANGE-ME-SYSTEM-CLIENT-SECRET
      HUB_KEYCLOAK_SYNCER_PERIOD: 5m
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/cryptomator
      QUARKUS_OIDC_TOKEN_ISSUER: https://kc.example.com/realms/cryptomator
      QUARKUS_OIDC_CLIENT_ID: cryptomatorhub
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/hub
      QUARKUS_DATASOURCE_USERNAME: hub
      QUARKUS_DATASOURCE_PASSWORD: CHANGE-ME-HUB-DB-PASSWORD
      # trust Traefik's X-Forwarded-* headers, so Hub knows it is served via https://
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      # the image's default CSP only allows same-origin connections, but the SPA must reach Keycloak's OIDC endpoints on the other hostname:
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'; connect-src 'self' api.cryptomator.org https://kc.example.com; object-src 'none'; child-src 'self'; img-src * data:; frame-ancestors 'none'"
      QUARKUS_OTEL_SDK_DISABLED: "true"
    labels:
      traefik.enable: "true"
      traefik.http.routers.hub.rule: "Host(`hub.example.com`)"
      traefik.http.routers.hub.entrypoints: websecure
      traefik.http.routers.hub.tls.certresolver: letsencrypt
      traefik.http.services.hub.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

configs:
  # Hub and Keycloak share the postgres instance but use separate databases:
  create-keycloak-db:
    content: |
      CREATE USER keycloak WITH PASSWORD 'CHANGE-ME-KEYCLOAK-DB-PASSWORD';
      CREATE DATABASE keycloak OWNER keycloak;

  # Minimal realm: realm roles, the three OIDC clients Hub relies on, one Hub admin and the service account used by Hub to sync users/groups.
  # Mirrors what the Helm chart renders (chart/templates/_realm.tpl).
  cryptomator-realm:
    content: |
      {
        "realm": "cryptomator",
        "displayName": "Cryptomator Hub",
        "loginTheme": "cryptomator",
        "enabled": true,
        "sslRequired": "external",
        "defaultRole": {
          "name": "user",
          "description": "User"
        },
        "roles": {
          "realm": [
            {
              "name": "user",
              "description": "User",
              "composite": false
            },
            {
              "name": "create-vaults",
              "description": "Can create vaults",
              "composite": false
            },
            {
              "name": "admin",
              "description": "Administrator",
              "composite": true,
              "composites": {
                "realm": [
                  "user",
                  "create-vaults"
                ],
                "client": {
                  "realm-management": [
                    "realm-admin"
                  ]
                }
              }
            }
          ]
        },
        "users": [
          {
            "username": "admin",
            "enabled": true,
            "credentials": [
              {
                "type": "password",
                "value": "CHANGE-ME-HUB-ADMIN-PASSWORD",
                "temporary": true
              }
            ],
            "requiredActions": [
              "UPDATE_PASSWORD"
            ],
            "realmRoles": [
              "admin"
            ]
          },
          {
            "username": "system",
            "email": "system@localhost",
            "enabled": true,
            "serviceAccountClientId": "cryptomatorhub-system",
            "clientRoles": {
              "realm-management": [
                "realm-admin",
                "view-system"
              ]
            }
          }
        ],
        "scopeMappings": [
          {
            "client": "cryptomatorhub",
            "roles": [
              "user",
              "admin"
            ]
          }
        ],
        "clients": [
          {
            "clientId": "cryptomatorhub",
            "serviceAccountsEnabled": false,
            "publicClient": true,
            "name": "Cryptomator Hub",
            "enabled": true,
            "redirectUris": [
              "https://hub.example.com/*"
            ],
            "webOrigins": [
              "+"
            ],
            "bearerOnly": false,
            "frontchannelLogout": false,
            "protocol": "openid-connect",
            "attributes": {
              "pkce.code.challenge.method": "S256"
            },
            "protocolMappers": [
              {
                "name": "realm roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": false,
                "config": {
                  "access.token.claim": "true",
                  "claim.name": "realm_access.roles",
                  "jsonType.label": "String",
                  "multivalued": "true"
                }
              },
              {
                "name": "client roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-client-role-mapper",
                "consentRequired": false,
                "config": {
                  "access.token.claim": "true",
                  "claim.name": "resource_access.$${client_id}.roles",
                  "jsonType.label": "String",
                  "multivalued": "true"
                }
              }
            ]
          },
          {
            "clientId": "cryptomator",
            "serviceAccountsEnabled": false,
            "publicClient": true,
            "name": "Cryptomator App",
            "enabled": true,
            "redirectUris": [
              "http://127.0.0.1/*",
              "org.cryptomator.ios:/hub/auth",
              "org.cryptomator.android:/hub/auth"
            ],
            "webOrigins": [
              "+"
            ],
            "bearerOnly": false,
            "frontchannelLogout": false,
            "protocol": "openid-connect",
            "attributes": {
              "pkce.code.challenge.method": "S256"
            }
          },
          {
            "clientId": "cryptomatorhub-system",
            "serviceAccountsEnabled": true,
            "publicClient": false,
            "name": "Cryptomator Hub System",
            "enabled": true,
            "clientAuthenticatorType": "client-secret",
            "secret": "CHANGE-ME-SYSTEM-CLIENT-SECRET",
            "standardFlowEnabled": false
          }
        ],
        "browserSecurityHeaders": {
          "contentSecurityPolicy": "frame-src 'self'; frame-ancestors 'self' https://hub.example.com; object-src 'none';"
        }
      }

volumes:
  postgres-data:
  letsencrypt:
