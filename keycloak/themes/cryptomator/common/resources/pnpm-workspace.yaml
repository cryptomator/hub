# pnpm workspace configuration.
# explicit allowlist of dependencies running scripts on install.
# only entries set to `true` here are permitted. Entries set to `false`
# record an intentional review decision and silence a warning for that package.
allowBuilds:
  # @parcel/watcher's install script downloads the platform-specific native
  # binary used by Tailwind's CLI to watch source files in `dev` mode.
  # Publisher @devongovett is the Parcel maintainer.
  '@parcel/watcher': true

# fail if any not allow-listed dependency executes a build script
strictDepBuilds: true

# refuse to install package versions younger than 3 days (=4320 minutes).
# exemptions go through `minimumReleaseAgeExclude`
# with justification in the PR.
minimumReleaseAge: 4320

# refuse any *transitive* dependency resolved from a non-registry source
# (git, tarball, github:, file:, link:, workspace:). Direct dependencies in
# package.json may still use those protocols when intentional, but a
# sub-dependency cannot smuggle one in.
blockExoticSubdeps: true
