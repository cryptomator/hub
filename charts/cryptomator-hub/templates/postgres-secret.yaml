{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-secrets-pg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.postgres.auth.adminPassword | quote }}
  initdb.sql: |-
    {{- if .Values.keycloak.enabled }}
    CREATE USER {{ .Values.keycloak.database.username }} WITH ENCRYPTED PASSWORD '{{ .Values.keycloak.database.password }}';
    CREATE DATABASE {{ .Values.keycloak.database.name }} WITH ENCODING 'UTF8' OWNER {{ .Values.keycloak.database.username }};
    {{- end }}
    CREATE USER {{ .Values.hub.database.username }} WITH ENCRYPTED PASSWORD '{{ .Values.hub.database.password }}';
    CREATE DATABASE {{ .Values.hub.database.name }} WITH ENCODING 'UTF8' OWNER {{ .Values.hub.database.username }};
{{- end }}
