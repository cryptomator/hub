{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-kc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cryptomator-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "cryptomator-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
      annotations:
        checksum/keycloak-secret: {{ include (print $.Template.BasePath "/keycloak-secret.yaml") . | sha256sum }}
        checksum/keycloak-config: {{ include (print $.Template.BasePath "/keycloak-realm-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until nc -zw 10 {{ include "cryptomator-hub.fullname" . }}-service-pg {{ .Values.postgres.service.port }}; do
                echo "waiting for postgres..."
              done
      {{- end }}
      containers:
        - name: keycloak
          image: "ghcr.io/cryptomator/keycloak:26.5.3"
          imagePullPolicy: {{ .Values.keycloak.imagePullPolicy }}
          command:
            - /opt/keycloak/bin/kc.sh
            - start
            - --optimized
            {{- if .Values.keycloak.realmBootstrap.enabled }}
            - --import-realm
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-kc
                  key: db-password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-kc
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-kc
                  key: admin-password
          envFrom:
            - configMapRef:
                name: {{ include "cryptomator-hub.fullname" . }}-config-kc
          startupProbe:
            httpGet:
              path: {{ printf "%s/health/started" (include "cryptomator-hub.keycloakRelativePath" .) }}
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health/live" (include "cryptomator-hub.keycloakRelativePath" .) }}
              port: management
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health/ready" (include "cryptomator-hub.keycloakRelativePath" .) }}
              port: management
            periodSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.keycloak.realmBootstrap.enabled }}
            - name: realm
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.keycloak.realmBootstrap.enabled }}
        - name: realm
          secret:
            secretName: {{ include "cryptomator-hub.fullname" . }}-secrets-kc
            items:
              - key: realm.json
                path: realm.json
        {{- end }}
{{- end }}
