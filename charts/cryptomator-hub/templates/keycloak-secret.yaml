{{- if or .Values.keycloak.enabled .Values.keycloak.realmBootstrap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-secrets-kc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.keycloak.enabled }}
  admin-username: {{ .Values.keycloak.admin.username | quote }}
  admin-password: {{ .Values.keycloak.admin.password | quote }}
  db-password: {{ .Values.keycloak.database.password | quote }}
  {{- end }}
  {{- if .Values.keycloak.realmBootstrap.enabled }}
  realm.json: |
{{ include "cryptomator-hub.realmJson" . | indent 4 }}
  {{- end }}
{{- end }}
