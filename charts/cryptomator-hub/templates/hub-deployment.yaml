apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cryptomator-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "cryptomator-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
      annotations:
        checksum/hub-config: {{ include (print $.Template.BasePath "/hub-configmap.yaml") . | sha256sum }}
        checksum/hub-secret: {{ if .Values.hub.secrets.create }}{{ include (print $.Template.BasePath "/hub-secret.yaml") . | sha256sum }}{{ else }}{{ print (include "cryptomator-hub.fullname" .) "-secrets-hub" | sha256sum }}{{ end }}
        {{- if and .Values.hub.metrics.enabled .Values.hub.metrics.otlp.username .Values.hub.metrics.otlp.password }}
        checksum/hub-metrics-secret: {{ include (print $.Template.BasePath "/hub-metrics-secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              jdbc_url="{{ include "cryptomator-hub.hubJdbcUrl" . }}"
              host_port="${jdbc_url#jdbc:postgresql://}"
              host_port="${host_port%%/*}"
              db_host="${host_port%%:*}"
              if [ "$host_port" = "$db_host" ]; then
                db_port=""
              else
                db_port="${host_port#*:}"
              fi
              if [ -z "$db_port" ]; then
                db_port="5432"
              fi
              until nc -zw 10 "$db_host" "$db_port"; do
                echo "waiting for postgres..."
              done
        - name: wait-for-oidc
          image: alpine/curl:8.17.0
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until [ "$(curl -sS -o /dev/null -w "%{http_code}" "{{ include "cryptomator-hub.oidcAuthServerUrl" . }}/.well-known/openid-configuration")" = "200" ]; do
                echo "waiting for OIDC discovery endpoint..."
                sleep 5
              done
      containers:
        - name: hub
          image: "ghcr.io/cryptomator/hub:{{ .Values.hub.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hub.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "cryptomator-hub.fullname" . }}-config-hub
          env:
            - name: HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_system_client_secret
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_db_password
            - name: HUB_INITIAL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_initial_id
                  optional: true
            - name: HUB_INITIAL_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_initial_license
                  optional: true
            {{- if and .Values.hub.metrics.enabled .Values.hub.metrics.otlp.username .Values.hub.metrics.otlp.password }}
            - name: QUARKUS_OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub-metrics
                  key: otlp_authorization
            {{- end }}
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
