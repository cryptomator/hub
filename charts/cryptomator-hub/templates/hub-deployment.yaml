apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cryptomator-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "cryptomator-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
      annotations:
        checksum/hub-config: {{ include (print $.Template.BasePath "/hub-configmap.yaml") . | sha256sum }}
        checksum/hub-secret: {{ if .Values.hub.secrets.create }}{{ include (print $.Template.BasePath "/hub-secret.yaml") . | sha256sum }}{{ else }}{{ print (include "cryptomator-hub.fullname" .) "-secrets-hub" | sha256sum }}{{ end }}
    spec:
      securityContext:
        runAsNonRoot: true
      {{- if or .Values.postgres.enabled .Values.keycloak.enabled }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until nc -zw 10 {{ include "cryptomator-hub.fullname" . }}-service-pg {{ .Values.postgres.service.port }}; do
                echo "waiting for postgres..."
              done
        {{- end }}
        {{- if .Values.keycloak.enabled }}
        - name: wait-for-keycloak
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until wget -q --spider "http://{{ include "cryptomator-hub.fullname" . }}-service-kc:{{ .Values.keycloak.service.managementPort }}{{ include "cryptomator-hub.keycloakRelativePath" . }}/health/live"; do
                echo "waiting for keycloak..."
                sleep 5
              done
        {{- end }}
      {{- end }}
      containers:
        - name: hub
          image: "ghcr.io/cryptomator/hub:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hub.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "cryptomator-hub.fullname" . }}-config-hub
          env:
            - name: HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_system_client_secret
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_db_password
            - name: HUB_INITIAL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_initial_id
                  optional: true
            - name: HUB_INITIAL_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-hub
                  key: hub_initial_license
                  optional: true
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
