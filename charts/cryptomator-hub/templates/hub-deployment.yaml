apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cryptomator-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "cryptomator-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
      annotations:
        checksum/hub-config: {{ include (print $.Template.BasePath "/hub-configmap.yaml") . | sha256sum }}
        checksum/hub-secret: {{ if and .Values.hub.secrets.create (not .Values.hub.secrets.existingSecret) }}{{ include (print $.Template.BasePath "/hub-secret.yaml") . | sha256sum }}{{ else }}{{ include "cryptomator-hub.hubSecretName" . | sha256sum }}{{ end }}
    spec:
      {{- with .Values.hub.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hub.waitForDependencies }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until nc -zw 10 {{ include "cryptomator-hub.postgresServiceName" . }} {{ .Values.postgres.service.port }}; do
                echo "waiting for postgres..."
              done
        {{- end }}
        {{- if .Values.keycloak.enabled }}
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until wget -q --spider "http://{{ include "cryptomator-hub.keycloakServiceName" . }}:{{ .Values.keycloak.service.managementPort }}{{ include "cryptomator-hub.keycloakRelativePath" . }}/health/live"; do
                echo "waiting for keycloak..."
                sleep 5
              done
        {{- end }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "cryptomator-hub.fullname" . }}-config
          env:
            - name: HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.hubSecretName" . }}
                  key: {{ .Values.hub.secrets.keys.systemClientSecret }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.hubDbPasswordSecretName" . }}
                  key: {{ include "cryptomator-hub.hubDbPasswordSecretKey" . }}
            - name: HUB_INITIAL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.hubSecretName" . }}
                  key: {{ .Values.hub.secrets.keys.initialId }}
                  optional: true
            - name: HUB_INITIAL_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.hubSecretName" . }}
                  key: {{ .Values.hub.secrets.keys.initialLicense }}
                  optional: true
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          {{- with .Values.hub.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
