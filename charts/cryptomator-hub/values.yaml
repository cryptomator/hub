global:
  host: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

hub:
  imagePullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    managementPort: 9000
  resources:
    requests:
      cpu: 10m
      memory: 8Mi
    limits:
      cpu: 500m
      memory: 64Mi
  config:
    publicRootPath: /
    keycloakRealm: cryptomator
    keycloakSyncerPeriod: 5m
    keycloakPublicUrl: ""
    keycloakLocalUrl: ""
    metricsEnabled: true
  oidc:
    clientId: cryptomatorhub
    authServerUrl: ""
    tokenIssuer: ""
  database:
    jdbcUrl: ""
    name: hub
    username: hub
    password: "change-me"
  admin:
    username: admin
    password: admin
    passwordTemporary: true
  secrets:
    create: true
    systemClientSecret: "" # optional; auto-generated when chart manages Hub secret
    initialId: ""
    initialLicense: ""

keycloak:
  enabled: true
  imagePullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
    managementPort: 9000
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 640Mi
  admin:
    username: admin
    password: admin
  config:
    relativePath: /kc
    proxyHeaders: xforwarded
    hostname: ""
  database:
    url: ""
    name: keycloak
    username: keycloak
    password: "change-me"
  realmBootstrap:
    enabled: true
    realmId: ""

postgres:
  enabled: true
  imagePullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  storage:
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  auth:
    adminUsername: postgres
    adminPassword: "change-me"
